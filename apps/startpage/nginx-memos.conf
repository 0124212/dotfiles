# --- Radicale ---
server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name radicale.junilab.xyz;
    ssl_certificate     /etc/letsencrypt/junilab.pem;
    ssl_certificate_key /etc/letsencrypt/junilab-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:RADJL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security always;
    location = /.well-known/caldav { return 301 /; }
    location = /.well-known/carddav { return 301 /; }
    location / {
        proxy_pass http://radicale:5232;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_header Authorization;
    }
}
