server_tokens off;
resolver 127.0.0.11 valid=10s ipv6=off;
limit_req_status 429;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
client_max_body_size 128m;

# Default: reject unknown hosts
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}

# --- Startpage root ---
server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name junilab.xyz www.junilab.xyz;
    ssl_certificate     /etc/letsencrypt/junilab.pem;
    ssl_certificate_key /etc/letsencrypt/junilab-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSLJL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    root /home/ubuntu/memos/startpage;
    index index.html;
    location / { try_files $uri $uri/ =404; }
}

# --- Memos ---
server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name memos.junilab.xyz;
    ssl_certificate     /etc/letsencrypt/junilab.pem;
    ssl_certificate_key /etc/letsencrypt/junilab-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:MEMOSJL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security always;
    add_header X-Content-Type-Options nosniff always;
    location = /api/v1/auth/signin {
        limit_req zone=login_limit burst=10 nodelay;
        proxy_pass http://memos:5230;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    location / {
        proxy_pass http://memos:5230;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

